# Composite action: Linux system dependencies for building the Dioxus desktop
# stack (wry/webkit2gtk) + the mold linker.
#
# Single source of truth — previously this exact apt list was copy-pasted in
# FOUR places (ci.yml quality, ci.yml build-release, ci.yml formal-verification,
# release.yml build) synchronized by a "keep in sync" comment, the classic
# drift-into-rot pattern.
#
# No `runs.when` needed: callers gate with `if: runner.os == 'Linux'`.
name: 'Linux build dependencies (webkit2gtk + mold)'
description: 'Installs the GTK/WebKit dev headers required to compile app-desktop on Linux'
runs:
  using: 'composite'
  steps:
    - name: Install Linux system dependencies (Dioxus desktop / webkit2gtk + mold)
      # On Linux the app-desktop crate (Dioxus desktop via wry/webkit2gtk) needs
      # the GTK/WebKit development headers to compile (gdk-sys/gtk-sys link
      # against gdk-3.0 etc.). Without them, clippy/build fail with
      # "system library `gdk-3.0` required by crate `gdk-sys` was not found".
      # macOS/Windows use native system toolchains and need none of these.
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libssl-dev \
          libxdo-dev \
          mold
