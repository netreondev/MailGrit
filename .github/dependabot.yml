# Dependabot — automated dependency-update PRs.
# Keeps Cargo dependencies and GitHub Actions current. Closes the gap that
# cargo-deny / cargo-audit only BLOCK on vulnerable versions but do not propose
# upgrades. Combined with the CI supply-chain gates, an update PR must still pass
# cargo-deny + cargo-audit + cargo-vet before it can merge.
#
# Schedule: weekly (Monday). Grouped to reduce PR noise.
version: 2

updates:
  # ---------------------------------------------------------------------------
  # Cargo workspace dependencies (crates.io).
  # ---------------------------------------------------------------------------
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Group patch/minor updates together; major versions get isolated PRs so
    # breaking changes are reviewed one crate at a time.
    groups:
      rust-patch:
        update-types: ["patch"]
        patterns: ["*"]
      rust-minor:
        update-types: ["minor"]
        patterns: ["*"]
    # allow-list: an EMPTY allow means "everything" (default). The previous
    # `- dependency-name: "*"` entry only ever widened a non-empty list; with
    # it the crypto crates below stopped being special. Keep the list empty
    # and rely on the groups above for batching; crypto crates ride the same
    # groups as everything else (cargo-deny/audit gate security relevance in CI).
    commit-message:
      prefix: "deps"
      include: "scope"
    labels: ["dependencies"]

  # ---------------------------------------------------------------------------
  # GitHub Actions used in workflows — keep them current to avoid
  # action-request forgery / compromised-action risk.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types: ["minor", "patch"]
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: "scope"
    labels: ["dependencies", "github-actions"]

  # ---------------------------------------------------------------------------
  # Playwright/npm dependencies of the E2E suite (e2e/package.json). The suite
  # runs in CI (the e2e job), so @playwright/test updates must be PR-tested.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
      include: "scope"
    labels: ["dependencies", "e2e"]

  # ---------------------------------------------------------------------------
  # Fuzz-target crate (fuzz/Cargo.toml — NOT a workspace member, so the "/"
  # cargo ecosystem above does not cover it).
  # ---------------------------------------------------------------------------
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
      include: "scope"
    labels: ["dependencies", "fuzz"]
