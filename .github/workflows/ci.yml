# MailGrit CI — three-platform matrix (Windows/Linux/macOS ARM).
# Full specification: formatting, lints, nextest, supply-chain, SAST.
#
# Targets:
#   - x86_64-pc-windows-msvc    (Windows)
#   - x86_64-unknown-linux-gnu  (Linux)
#   - aarch64-apple-darwin      (macOS ARM / Apple Silicon)
#
# Strict release gate: RUSTFLAGS="-D warnings" makes every rustc warning a
# blocking error on build/test/doc. Clippy adds `-D warnings` on top (plus the
# pedantic/nursery/cargo groups via [workspace.lints]). The formal-verification
# jobs here (Miri, cargo-mutants, exploratory fuzz) are BLOCKING — no
# `continue-on-error`. Kani is in a separate scheduled workflow (kani.yml).
# The single accepted lint exception is `-A clippy::multiple_crate_versions`
# (transitive duplicates of the GUI/crypto stack, covered by cargo-deny advisories).
#
# Fast linker (mold/lld) and sccache are wired per-target (see .cargo/config.toml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # Treat any compiler warning as an error across build/test/doc. This is the
  # release gate: missing_docs, dead_code, unused, rust_2018_idioms are all
  # denied in [workspace.lints.rust]; this flag makes them fail the build.
  RUSTFLAGS: "-D warnings"
  # NOTE: sccache env (RUSTC_WRAPPER, SCCACHE_GHA_ENABLED) is NOT set globally.
  # It is scoped to the `quality` and `build-release` jobs — the only ones that
  # install sccache via mozilla-actions/sccache-action. Setting RUSTC_WRAPPER
  # globally would make cargo-deny/audit/vet/fuzz/kani/mutants crash with
  # "No such file or directory" trying to invoke the missing sccache binary.

jobs:
  # ============================================================================
  # Supply-chain, SAST, secret scanning — fast, gating, Linux-only.
  # Run before the expensive matrix build so a vulnerable dep or a leaked secret
  # fails the PR within seconds, not after a 15-minute cross-platform build.
  # ============================================================================
  supply-chain:
    name: Supply chain, SAST & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan all commits, not just the PR tip.
          fetch-depth: 0

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          # cargo-vet pinned: the @v2 manifest resolves "cargo-vet" (unpinned)
          # to v0.10.0 from GitHub Releases, but supply-chain/imports.lock was
          # generated by v0.10.2 which introduced the `trusted-publisher` field.
          # v0.10.0 rejects that field with "missing field `user-id` for key
          # publisher.wit-bindgen", failing `cargo vet regenerate imports`.
          # Pin to v0.10.2 to match the lockfile format.
          tool: cargo-deny,cargo-audit,cargo-vet@0.10.2,cargo-machete

      # --- Secret scanning (gitleaks) -----------------------------------------
      # Scans the full git history + the diff for accidentally-committed secrets.
      # Config: .gitleaks.toml (extends the default rule set).
      - name: Secret scanning — gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail on any finding (no baseline / allowlist beyond .gitleaks.toml).
          GITLEAKS_ENABLE_COMMENTS: "true"

      # --- SAST (Semgrep) -----------------------------------------------------
      # Rule set: Rust security, secret-detection, common audit findings.
      # Focus: format!-built JS strings (injection into the privileged webview)
      # and secret values reaching tracing logs.
      - name: SAST — Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/rust p/secret-detection p/security-audit p/owasp-top-ten"

      # --- Supply-chain: cargo-deny + cargo-audit + cargo-vet -----------------
      - name: Supply-chain — cargo-deny (advisories, bans, licenses, sources)
        run: cargo deny check advisories bans licenses sources

      - name: Supply-chain — cargo-audit (independent advisory check)
        run: cargo audit

      - name: Supply-chain — cargo-vet (audited / imported attestations)
        # Refresh the imported third-party audits (Mozilla/Google/Bytecode
        # Alliance/Embark) from their sources, then verify every dependency is
        # either vetted, imported, or explicitly exempted with a reason. Fails
        # the build on any unaudited crate.
        run: |
          cargo vet regenerate imports
          cargo vet check --verbose=info

      - name: Unused deps — cargo-machete
        run: cargo machete --skip-target-dir

  # ============================================================================
  # Quality & tests — three-platform matrix.
  # ============================================================================
  quality:
    name: Quality & Tests (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: supply-chain
    timeout-minutes: 45
    # No sccache. It is a build-speed optimization, but sccache routes its cache
    # through GitHub's Actions Cache backend (ghac), which has been persistently
    # unstable for this repo: both a direct RUSTC_WRAPPER=sccache AND a probe-and
    # -fallback wrapper (.github/sccache-wrapper.sh, retained as a reference)
    # failed the build when ghac was unavailable — the wrapper added its own
    # failure mode on cargo's startup version-probe. Build correctness must not
    # depend on ghac availability; CI compiles deterministically uncached.
    strategy:
      fail-fast: false
      matrix:
        include:
          # CI and release share the same Linux image (ubuntu-22.04) so the
          # tested glibc matches the shipped binary's glibc.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - os: macos-14       # Apple Silicon (M1) runner
            target: aarch64-apple-darwin
            name: macos-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        run: rustup show active-toolchain || rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux system dependencies (mold linker + Dioxus desktop / webkit2gtk)
        # On Linux the app-desktop crate (Dioxus desktop via wry/webkit2gtk) needs
        # the GTK/WebKit development headers to compile (gdk-sys/gtk-sys link
        # against gdk-3.0 etc.). Without them, clippy/build fail with
        # "system library `gdk-3.0` required by crate `gdk-sys` was not found".
        # Keep this list in sync with release.yml's Linux deps step. macOS/Windows
        # use native system toolchains and need none of these.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            mold

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-semver-checks,cargo-msrv

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: "Clippy (strict: -D warnings — pedantic/nursery lints in [workspace.lints])"
        # Strictness level is set declaratively in [workspace.lints.clippy] (deny
        # correctness/suspicious/complexity/perf/pedantic/nursery/cargo). `-D warnings`
        # here (and the global RUSTFLAGS) is a safety net: no warning passes CI.
        # Exception: multiple_crate_versions stays warn — these are transitive duplicates
        # of the GUI stack (dioxus/wry/windows), outside our control; real vulnerabilities
        # are blocked by a separate cargo-deny step (advisories).
        run: cargo clippy --workspace --all-targets --all-features --target ${{ matrix.target }} -- -D warnings -A clippy::multiple_crate_versions

      - name: SemVer checks (public API of internal crates)
        run: cargo semver-checks --workspace

      # Verify the declared MSRV (rust-version = "1.97.1") is actually the
      # minimum: cargo-msrv probes the lowest toolchain that still compiles.
      # The MSRV is declared in [workspace.package].rust-version (a *virtual*
      # workspace — no [package] at the root). cargo-msrv 0.19.x does not read
      # inherited workspace.package.rust-version for verify (foresterre/cargo-msrv
      # #1319, PR #1318 not yet released), failing with "Unable to find key
      # 'package.rust-version'". Pass the MSRV explicitly with --rust-version so
      # verification does not depend on manifest parsing. Keep this value in sync
      # with [workspace.package].rust-version in Cargo.toml.
      - name: MSRV verify (declared minimum supported Rust version)
        run: cargo msrv --workspace verify --rust-version 1.97.1

      - name: Tests (nextest, process-isolated, --all-features)
        run: cargo nextest run --workspace --profile ci --all-features --target ${{ matrix.target }}

      - name: Doc tests (--all-features)
        run: cargo test --workspace --doc --all-features --target ${{ matrix.target }}

      # Compile the criterion benchmarks (without running them). This catches
      # benchmark *compile* breakage cheaply; full timing runs are local-only
      # (see crates/core-csv/benches/ and crates/core-security/benches/). This
      # step does NOT measure performance, so it cannot catch perf regressions —
      # only that the benchmarks still build.
      - name: Benchmarks compile (criterion, compile-only)
        if: runner.os == 'Linux'
        run: cargo bench --no-run -p mailgrit-core-csv -p mailgrit-core-security

      - name: Upload nextest results (degradation metric)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-${{ matrix.name }}
          path: target/nextest/ci/junit.xml

  build-release:
    name: Release build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: quality
    timeout-minutes: 45
    # No sccache — see the quality job note (ghac instability). Build correctness
    # must not depend on the cache backend's availability.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same image as the quality job + release.yml (ubuntu-22.04) for glibc
          # parity between the tested and the shipped binary.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (pinned)
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      # Same Linux GTK/webkit deps as the quality job: app-desktop (Dioxus
      # desktop / webkit2gtk) needs gdk-3.0 & friends to compile on Linux.
      - name: Install Linux system dependencies (mold + Dioxus desktop / webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            mold
      - name: Build release (--all-features, warnings-as-errors)
        run: cargo build --release --workspace --all-features --target ${{ matrix.target }}

  # ==========================================================================
  # Fuzz regression — runs the committed seed corpus against every fuzz target.
  # Distinct from the continuous-fuzz job (which explores for NEW crashes with a
  # time budget): this job replays known inputs deterministically and FAILS if
  # any of them panics, catching regressions in parsers immediately on a PR.
  # Seeds live in fuzz/seeds/<target>/ (committed) — fuzz/corpus/ is gitignored.
  # BLOCKING.
  # ==========================================================================
  fuzz-regression:
    name: Fuzz regression (seed corpus)
    runs-on: ubuntu-latest
    needs: supply-chain
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust
        run: rustup toolchain install nightly
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz
      - name: Replay seed corpus against every fuzz target
        working-directory: fuzz
        run: |
          set -e
          # For each target with a committed seed dir, run the fuzzer over those
          # exact inputs (-runs=0 means "only the corpus, no random mutation").
          for tgt in parse_csv_bytes parse_domain parse_username parse_quota url_parse; do
            seed_dir="seeds/$tgt"
            if [ -d "$seed_dir" ] && [ -n "$(ls -A "$seed_dir" 2>/dev/null)" ]; then
              echo "::group::Replaying $tgt"
              cargo +nightly fuzz run "fuzz_$tgt" "$seed_dir" -- -runs=0
              echo "::endgroup::"
            else
              echo "::notice::No committed seeds for $tgt — skipped (exploratory fuzz job still covers it)."
            fi
          done

  # ==========================================================================
  # Formal verification (nightly-only, BLOCKING) — cargo-mutants + Miri.
  # - cargo-mutants: runs on the core crates only (app-desktop excluded via
  #   .cargo/mutants.toml). Green: 212 mutants, 0 missed (boundary-value tests
  #   cover every MAX_*_LEN parser guard; intrinsically-untestable mutants are
  #   excluded in .cargo/mutants.toml with justification).
  # - Miri (UB detection): interprets the four core crates (~1 min total). The
  #   two expensive cases (proptest, password_gen) are compiled out under Miri
  #   via #[cfg(not(miri))]; KDF/storage-audit already use cfg_attr(miri,ignore).
  #   What remains is the real UB-relevant surface: parsers, AEAD, hash chain.
  # ==========================================================================
  formal-verification:
    name: Formal verification (Miri + cargo-mutants)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # cargo-mutants --workspace compiles app-desktop (Dioxus desktop), which
      # needs the GTK/webkit headers on Linux (same as quality/build-release).
      - name: Install Linux system dependencies (mold + Dioxus desktop / webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            mold
      - name: Install nightly Rust (with Miri)
        run: rustup toolchain install nightly --component miri
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutation testing (unit-test effectiveness)
        run: cargo +nightly mutants --workspace --in-place
      # Miri (UB detection) over the four core crates. Runs in ~1 min total now:
      # the two expensive cases are compiled out under Miri —
      #   - core-csv proptest (thousands of proptest iterations under the
      #     interpreter → #![cfg(not(miri))] in proptest_csv.rs),
      #   - core-domain password_gen tests (100-500 OsRng generations per case,
      #     pure safe Rust, no UB signal → #[cfg(not(miri))] on the test module).
      # KDF (Argon2) and storage-audit tests already carry cfg_attr(miri, ignore).
      # What remains is the real UB-relevant surface: parsers, AEAD glue, the
      # hash chain, CSV mapping — all interpreted by Miri here.
      - name: Miri (UB detection — storage, csv, domain, security)
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: |
          cargo +nightly miri test -p mailgrit-core-storage
          cargo +nightly miri test -p mailgrit-core-csv
          cargo +nightly miri test -p mailgrit-core-domain
          cargo +nightly miri test -p mailgrit-core-security

  # NOTE: Kani formal verification is in .github/workflows/kani.yml (scheduled,
  # weekly). It was removed from this per-push CI because kani-github-action's
  # bootstrap (Kani + pinned nightly + compiling core-domain) takes ~30 min and
  # hits the job timeout, and a job timeout CANCELS THE ENTIRE RUN (GitHub
  # Actions cancels in-flight jobs when one is cancelled by timeout — neither
  # continue-on-error nor a large timeout avoids the run-level cancellation).
  # The core-domain parser harnesses DO verify under Kani (0 of 358 checks
  # failed in a prior run); the limitation is bootstrap time, not proof
  # complexity. Kani runs weekly via its own workflow so it can take its time.

  fuzz:
    name: Continuous fuzzing
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust
        run: rustup toolchain install nightly
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz
      # Exploratory fuzzing: a newly-found crash FAILS the PR (no
      # continue-on-error). 60s budget per target.
      - name: Run fuzz targets (limited duration in CI)
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run fuzz_parse_csv_bytes -- -max_total_time=60
          cargo +nightly fuzz run fuzz_parse_domain -- -max_total_time=60
          cargo +nightly fuzz run fuzz_parse_username -- -max_total_time=60
          cargo +nightly fuzz run fuzz_parse_quota -- -max_total_time=60
          cargo +nightly fuzz run fuzz_url_parse -- -max_total_time=60
