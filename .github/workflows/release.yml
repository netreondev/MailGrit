# Builds native release binaries for Windows / Linux / macOS and publishes
# them as a GitHub Release, attaching verification materials:
#   - cargo-auditable:  dependency list embedded into every binary.
#   - CycloneDX SBOM:    one .cdx.json per release, attached as an asset.
#   - Build provenance: build-origin attestation (GitHub-native
#                        actions/attest-build-provenance, keyless OIDC).
#   - cosign (keyless):  detached signature per archive, verified via Rekor.
#
# Triggered manually or on version tags (v*).
name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
      inputs:
        tag:
          description: "Release tag (e.g. v0.1.4)"
          required: true
          default: "v0.1.4"

# id-token: write is REQUIRED for cosign keyless (OIDC) signing and for the
# provenance attestation; contents: write is needed to attach assets to the
# release. Both are granted at JOB level (provenance/release; sign needs only
# id-token), not here: the workflow-level default is read-only so the
# compile-only jobs (verify, build) cannot write repo contents or mint OIDC
# identities.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # Verify — tests + version consistency BEFORE anything is built or signed.
  # Previously the pipeline went straight to build → attest → sign → publish:
  # a tag on an untested commit produced signed, attested, "verified" release
  # binaries. Nothing checked the tag against workspace.package.version either
  # (the version is spelled out in 10 manually-synced sites across 6 files —
  # see scripts/check_version.py).
  # ==========================================================================
  verify:
    name: Verify (tests + tag/version match)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        # Full history: check_version.py reads the working tree only (the tag
        # arrives via GITHUB_REF / the dispatch input), but the SemVer step
        # below compares against HEAD^ (--baseline-rev) — the parent commit
        # must exist locally, which a shallow checkout cannot guarantee.
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (pinned 1.97.1)
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Install cargo tools (nextest, semver-checks, msrv)
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Same pins as the ci.yml quality job: a release must be verified
          # by exactly the tool versions CI verified the commit with.
          tool: cargo-nextest@0.9.143,cargo-semver-checks@0.50.0,cargo-msrv@0.19.3

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Clippy (strict)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A clippy::multiple_crate_versions

      # SemVer + MSRV: previously these ran ONLY in the ci.yml quality job,
      # so a tag whose public API broke semver (or dropped below the declared
      # MSRV) could still produce a release if CI had not run on that exact
      # commit. The verify job now enforces release parity with CI quality.
      #
      # Baseline: the tagged commit's first parent (HEAD^). A tag push has no
      # meaningful event.before, and for a tag on a merge commit HEAD^ is the
      # first parent — the code being released is compared against the commit
      # it directly descends from. The parent MUST resolve (fetch-depth: 0 on
      # the checkout above; cat-file validates it is a real commit) — a semver
      # gate that cannot find its baseline fails LOUDLY instead of passing.
      # For workflow_dispatch the same logic compares the dispatched head
      # against its parent, which is the exact parity with what a tag on that
      # commit would check.
      # All workspace crates are publish=false (never published to crates.io):
      # `--workspace` alone would SKIP every one of them (decorative gate —
      # see the ci.yml quality job note). Explicit -p selection is the
      # documented way to check internal crates (cargo-semver-checks 0.50.0,
      # src/lib.rs); the list is generated from cargo metadata so a new crate
      # can never silently fall outside the gate.
      # shell: bash: the default Linux shell here is already bash, but the
      # explicit setting keeps the POSIX-ish constructs guaranteed.
      - name: SemVer checks (public API of internal crates vs the tagged commit's parent)
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$(git rev-parse --verify -q HEAD^)" || {
            echo "::error::cannot resolve HEAD^ — the tagged/dispatched commit has no parent locally (fetch-depth must be 0). The semver gate refuses to run blind."
            exit 1
          }
          if ! git cat-file -e "${BASELINE}^{commit}" 2>/dev/null; then
            echo "::error::semver baseline commit unavailable: '${BASELINE}'"
            exit 1
          fi
          # Command substitution instead of a process-substitution while-loop:
          # Git Bash on Windows runners truncates <(...) feeds after the first
          # line (observed 2026-08-16 in the ci.yml quality job). Crate names
          # cannot contain whitespace, so the unquoted for-split is safe.
          names="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')"
          if [ -z "${names//[[:space:]]/}" ]; then
            echo "::error::cargo metadata produced no package names — the semver gate refuses to run blind."
            exit 1
          fi
          args=()
          for name in ${names}; do
            args+=("-p" "${name}")
          done
          echo "SemVer baseline: ${BASELINE}; crates: ${args[*]}"
          cargo semver-checks "${args[@]}" --baseline-rev "${BASELINE}"

      # --rust-version passed explicitly: cargo-msrv 0.19.x cannot read the
      # inherited workspace.package.rust-version (see the ci.yml quality job
      # note). Keep the value in sync with [workspace.package].rust-version.
      - name: MSRV verify (declared minimum supported Rust version)
        run: cargo msrv --workspace verify --rust-version 1.97.1

      - name: Tests (nextest, process-isolated, --all-features)
        run: cargo nextest run --workspace --profile ci --all-features

      - name: Doc tests (--all-features)
        run: cargo test --workspace --doc --all-features

      # Tag ↔ version: a mistag (or a forgotten version bump) must fail HERE,
      # not as an inconsistent release. Expressions reach the shell only
      # through env (inputs.tag is user input — see the release job note).
      - name: Version consistency + tag match
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/check_version.py --tag "$TAG_INPUT"
          else
            python scripts/check_version.py --tag "${GITHUB_REF#refs/tags/}"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            binary: mailgrit-app-desktop.exe
            archive: mailgrit-windows-x86_64.zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            binary: mailgrit-app-desktop
            archive: mailgrit-linux-x86_64.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
            binary: mailgrit-app-desktop
            archive: mailgrit-macos-arm64.tar.gz
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Install Rust toolchain (pinned 1.97.1)
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo tools (cargo-auditable, cargo-cyclonedx, cargo-bloat)
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        # GITHUB_TOKEN authenticates api.github.com version resolution —
        # anonymous calls from shared runner IPs 403 under the 60/hr quota.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-auditable,cargo-cyclonedx,cargo-bloat

      - name: Install Linux system dependencies (Dioxus desktop / webkit2gtk)
        uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'

      # cargo-auditable wraps `cargo build`: it injects a `.dep-vices` section
      # into the binary with the full dependency list + known advisories at
      # build time. A downloaded binary can then be scanned with
      # `cargo audit bin <path>` without source access.
      # DEFAULT features only: `e2e` is a TEST-ONLY cargo feature (dashboard
      # override, MAILGRIT_LOGIN_URL) — release binaries must not contain the
      # hooks. The feature IS still compiled and linted by the CI quality job
      # (clippy/tests run --all-features), so no feature-gated path ships
      # untested — it just does not ship IN the binary.
      - name: Build release binary (auditable — deps embedded)
        run: cargo auditable build --release -p mailgrit-app-desktop --target ${{ matrix.target }}

      # CycloneDX SBOM for the desktop binary crate. Captures the resolved
      # dependency tree (incl. versions + licenses) at release time.
      # cargo-cyclonedx 0.5.x has no --output-cdx/-p flags; target a crate via
      # --manifest-path. It writes <package>.cdx.json next to that manifest.
      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx --format json --manifest-path crates/app-desktop/Cargo.toml
          # Copy the generated SBOM to the workspace root so the staging steps
          # find it at a single known path regardless of crate dir layout.
          cp crates/app-desktop/mailgrit-app-desktop.cdx.json mailgrit-app-desktop.cdx.json

      # Binary-size report (non-blocking diagnostic): which crates contribute
      # most to the final binary. Uploaded as an artifact for trend tracking.
      - name: Binary size report (cargo-bloat)
        continue-on-error: true
        shell: bash
        run: |
          cargo bloat --release -p mailgrit-app-desktop --target ${{ matrix.target }} --crates -n 50 > bloat-${{ matrix.name }}.txt || true
          cat bloat-${{ matrix.name }}.txt || true

      - name: Stage binary + SBOM + README (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" stage/
          cp README.md README.uk.md LICENSE-MIT LICENSE-APACHE stage/
          # SBOM: cargo-cyclonedx writes <package>.cdx.json next to the manifest.
          # One copy goes INTO the archive; one stays at the workspace root so
          # the artifact upload keeps it FLAT (upload-artifact preserves the
          # stage/ prefix, which made the release job's files: globs miss it —
          # the reason no SBOM ever reached the v0.1.3-v0.1.4 drafts).
          cp mailgrit-app-desktop.cdx.json stage/mailgrit-sbom-${{ matrix.name }}.cdx.json
          cp mailgrit-app-desktop.cdx.json mailgrit-sbom-${{ matrix.name }}.cdx.json
          7z a "${{ matrix.archive }}" ./stage/*
          ls -la "${{ matrix.archive }}"

      - name: Stage binary + SBOM + README (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" stage/
          cp README.md README.uk.md LICENSE-MIT LICENSE-APACHE stage/
          cp mailgrit-app-desktop.cdx.json stage/mailgrit-sbom-${{ matrix.name }}.cdx.json
          cp mailgrit-app-desktop.cdx.json mailgrit-sbom-${{ matrix.name }}.cdx.json
          tar -czf "${{ matrix.archive }}" -C stage .
          ls -la "${{ matrix.archive }}"

      # Compute sha256 of the archive, one "<hash>  <file>" per line. Uploaded
      # as a build artifact for audit; cosign signs the archives themselves and
      # the provenance attestation binds them by digest.
      - name: Compute sha256 checksums
        shell: bash
        run: |
          # Cross-OS sha256: no single tool exists on all three runners.
          #   Linux:  sha256sum  (GNU coreutils)
          #   macOS:  shasum -a 256
          #   Windows (Git Bash): neither — use PowerShell Get-FileHash.
          # Detect the first available one and emit the standard
          # "<hash>  <file>" line (the sha256sum text format).
          file="${{ matrix.archive }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$file" > hashes-${{ matrix.name }}.txt
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$file" > hashes-${{ matrix.name }}.txt
          else
            # Windows Git Bash fallback: PowerShell writes "<hash>" on its own
            # line; reformat into the "<hash>  <file>" shape the consumers expect.
            h=$(powershell -NoProfile -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath '$file').Hash.ToLower()")
            printf '%s  %s\n' "$h" "$file" > hashes-${{ matrix.name }}.txt
          fi
          cat hashes-${{ matrix.name }}.txt

      - name: Upload build artifact (archive + SBOM + bloat + hashes)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            mailgrit-sbom-${{ matrix.name }}.cdx.json
            hashes-${{ matrix.name }}.txt
            bloat-${{ matrix.name }}.txt
          retention-days: 7
          if-no-files-found: error

  # ==========================================================================
  # Build provenance — GitHub-native artifact attestation. See the comment
  # inside the job for the history (replaced slsa-github-generator).
  # ==========================================================================
  provenance:
    name: Build provenance (artifact attestation)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # OIDC — signs the attestation keylessly
      attestations: write  # stores the attestation for the repository
      contents: read
    steps:
      # ==========================================================================
      # GitHub-native artifact attestation (actions/attest-build-provenance).
      # Replaces the third-party slsa-github-generator reusable workflow
      # (v2.1.0, Feb 2025 — its last release), which rotted under the 2026
      # runner images: its internal composite steps fail with "Input required
      # and not supplied: path" (exit 27, seen 2026-08-16). The attestation is
      # stored in the repository's attestation store and verified with
      # `gh attestation verify <archive> -R netreondev/MailGrit`.
      # ==========================================================================
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Attest build provenance for every archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/mailgrit-windows-x86_64.zip
            release-assets/mailgrit-linux-x86_64.tar.gz
            release-assets/mailgrit-macos-arm64.tar.gz

  # ==========================================================================
  # cosign keyless signing — detached signature per archive.
  # Signs each archive's sha256 with an ephemeral key issued via the GitHub OIDC
  # identity. The signature + certificate are published to the Sigstore Rekor
  # transparency log, so anyone can verify authenticity later without trusting
  # GitHub. Output: <archive>.sig + <archive>.pem per platform.
  # ==========================================================================
  sign:
    name: cosign sign (keyless)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      # Least privilege: this job only downloads artifacts, signs them with an
      # OIDC-issued ephemeral key, and uploads artifacts — it never touches
      # repo contents.
      id-token: write
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.4.1"   # pinned for reproducibility

      # Keyless (passwordless) signing: cosign requests an ephemeral certificate
      # from Fulcio using the workflow's OIDC identity, signs each archive,
      # uploads the signature + certificate to Rekor.
      - name: Sign every archive (keyless, via Rekor)
        env:
          COSIGN_EXPERIMENTAL: "1"   # keyless mode
        run: |
          set -euo pipefail
          for archive in release-assets/mailgrit-windows-x86_64.zip \
                         release-assets/mailgrit-linux-x86_64.tar.gz \
                         release-assets/mailgrit-macos-arm64.tar.gz; do
            echo "Signing $archive ..."
            # sign-blob: detached .sig + writes the signing cert to .pem.
            cosign sign-blob --yes --output-signature "${archive}.sig" --output-certificate "${archive}.pem" "$archive"
            echo "Signed: ${archive}.sig + ${archive}.pem"
          done

      - name: Upload signing artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signatures
          path: |
            release-assets/mailgrit-windows-x86_64.zip.sig
            release-assets/mailgrit-windows-x86_64.zip.pem
            release-assets/mailgrit-linux-x86_64.tar.gz.sig
            release-assets/mailgrit-linux-x86_64.tar.gz.pem
            release-assets/mailgrit-macos-arm64.tar.gz.sig
            release-assets/mailgrit-macos-arm64.tar.gz.pem
          retention-days: 7
          if-no-files-found: error

  # ==========================================================================
  # Publish — attach archives + SBOMs + signatures to the GitHub Release.
  # Provenance is already attached by the provenance job (upload-assets: true).
  # ==========================================================================
  release:
    name: Publish GitHub Release
    needs: [build, provenance, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Download all artifacts (archives, SBOMs, signatures)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets/

      - name: Determine tag
        id: tag
        # Expressions reach the shell only through env variables: a ${{ ... }}
        # interpolated directly into run: would let a dispatch caller control
        # the script (inputs.tag is user input, not a constant).
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Heredoc delimiter form: a multi-line dispatch input cannot
            # inject an extra output key the way `echo "tag=$VAR"` would.
            {
              echo "tag<<MAILGRIT_TAG_EOF"
              echo "${TAG_INPUT}"
              echo "MAILGRIT_TAG_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tag<<MAILGRIT_TAG_EOF"
              echo "${GITHUB_REF#refs/tags/}"
              echo "MAILGRIT_TAG_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update release with binaries, SBOMs and signatures
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: MailGrit ${{ steps.tag.outputs.tag }}
          body: |
            ## MailGrit ${{ steps.tag.outputs.tag }}

            Cross-platform desktop client for bulk iRedAdmin automation.

            ### Downloads
            - **Windows** (x86_64): `mailgrit-windows-x86_64.zip`
            - **Linux** (x86_64): `mailgrit-linux-x86_64.tar.gz`
            - **macOS** (Apple Silicon): `mailgrit-macos-arm64.tar.gz`

            ### Verifying your download
            Each archive carries a detached **signature**
            (`<archive>.sig` + `<archive>.pem`), a **build-provenance
            attestation** (GitHub artifact attestations), and a per-platform
            **CycloneDX SBOM** (`mailgrit-sbom-*.cdx.json`). Every binary
            embeds its full dependency list (cargo-auditable).

            Verify a signature (requires [cosign](https://github.com/sigstore/cosign)):
            ```bash
            cosign verify-blob \
              --certificate mailgrit-windows-x86_64.zip.pem \
              --signature mailgrit-windows-x86_64.zip.sig \
              --certificate-identity-regexp 'https://github.com/netreondev/MailGrit/.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              mailgrit-windows-x86_64.zip
            ```

            Verify build provenance (requires [GitHub CLI](https://cli.github.com/)):
            ```bash
            gh attestation verify mailgrit-windows-x86_64.zip \
              --repo netreondev/MailGrit
            ```

            Scan a binary for known vulnerabilities (dependency list is embedded):
            ```bash
            cargo install cargo-audit cargo-auditable
            cargo audit bin ./mailgrit-app-desktop.exe
            ```

            See the [README](https://github.com/netreondev/MailGrit#readme) for usage and the [website](https://netreondev.github.io/MailGrit/) for an overview.

            Dual-licensed under MIT OR Apache-2.0.
          files: |
            release-assets/mailgrit-windows-x86_64.zip
            release-assets/mailgrit-linux-x86_64.tar.gz
            release-assets/mailgrit-macos-arm64.tar.gz
            release-assets/mailgrit-windows-x86_64.zip.sig
            release-assets/mailgrit-windows-x86_64.zip.pem
            release-assets/mailgrit-linux-x86_64.tar.gz.sig
            release-assets/mailgrit-linux-x86_64.tar.gz.pem
            release-assets/mailgrit-macos-arm64.tar.gz.sig
            release-assets/mailgrit-macos-arm64.tar.gz.pem
            release-assets/mailgrit-sbom-windows-x86_64.cdx.json
            release-assets/mailgrit-sbom-linux-x86_64.cdx.json
            release-assets/mailgrit-sbom-macos-arm64.cdx.json
          # Draft first: a human reviews assets/signatures/provenance before the
          # tag goes public (the job holds contents:write + id-token:write).
          draft: true
          prerelease: false
