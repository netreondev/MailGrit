# Builds native release binaries for Windows / Linux / macOS and publishes
# them as a GitHub Release, with full supply-chain hardening:
#   - cargo-auditable:  dependency list embedded into every binary.
#   - CycloneDX SBOM:    one .cdx.json per release, attached as an asset.
#   - SLSA provenance:   build-origin attestation (slsa-github-generator).
#   - cosign (keyless):  detached signature per archive, verified via Rekor.
#
# Triggered manually or on version tags (v*).
name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
      inputs:
        tag:
          description: "Release tag (e.g. v0.1.3)"
          required: true
          default: "v0.1.3"

# id-token: write is REQUIRED for cosign keyless (OIDC) signing and for SLSA
# provenance generation. contents: write is needed to attach assets to the
# release and to upload provenance.
permissions:
  contents: write
  id-token: write
  actions: read   # SLSA generator reads the build job's run metadata.

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    outputs:
      # sha256sum lines ("<hash>  <file>") of every archive, consumed by the
      # provenance job (SLSA subjects) and the sign job (cosign targets).
      hashes: ${{ steps.hash.outputs.hashes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            binary: mailgrit-app-desktop.exe
            archive: mailgrit-windows-x86_64.zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            binary: mailgrit-app-desktop
            archive: mailgrit-linux-x86_64.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
            binary: mailgrit-app-desktop
            archive: mailgrit-macos-arm64.tar.gz
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Install Rust toolchain (pinned 1.97.1)
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo tools (cargo-auditable, cargo-cyclonedx, cargo-bloat)
        uses: taiki-e/install-action@0b63bc859f7224657cf7e39426848cabaa36f456 # v2.49.9
        with:
          tool: cargo-auditable,cargo-cyclonedx,cargo-bloat

      - name: Install Linux system dependencies (Dioxus desktop / webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            mold

      # cargo-auditable wraps `cargo build`: it injects a `.dep-vices` section
      # into the binary with the full dependency list + known advisories at
      # build time. A downloaded binary can then be scanned with
      # `cargo audit bin <path>` without source access.
      # DEFAULT features only: `e2e` is a TEST-ONLY cargo feature (dashboard
      # override, MAILGRIT_LOGIN_URL) — release binaries must not contain the
      # hooks. The feature IS still compiled and linted by the CI quality job
      # (clippy/tests run --all-features), so no feature-gated path ships
      # untested — it just does not ship IN the binary.
      - name: Build release binary (auditable — deps embedded)
        run: cargo auditable build --release -p mailgrit-app-desktop --target ${{ matrix.target }}

      # CycloneDX SBOM for the desktop binary crate. Captures the resolved
      # dependency tree (incl. versions + licenses) at release time.
      # cargo-cyclonedx 0.5.x has no --output-cdx/-p flags; target a crate via
      # --manifest-path. It writes <package>.cdx.json next to that manifest.
      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx --format json --manifest-path crates/app-desktop/Cargo.toml
          # Copy the generated SBOM to the workspace root so the staging steps
          # find it at a single known path regardless of crate dir layout.
          cp crates/app-desktop/mailgrit-app-desktop.cdx.json mailgrit-app-desktop.cdx.json

      # Binary-size report (non-blocking diagnostic): which crates contribute
      # most to the final binary. Uploaded as an artifact for trend tracking.
      - name: Binary size report (cargo-bloat)
        continue-on-error: true
        shell: bash
        run: |
          cargo bloat --release -p mailgrit-app-desktop --target ${{ matrix.target }} --crates -n 50 > bloat-${{ matrix.name }}.txt || true
          cat bloat-${{ matrix.name }}.txt || true

      - name: Stage binary + SBOM + README (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" stage/
          cp README.md README.uk.md LICENSE-MIT LICENSE-APACHE stage/
          # SBOM: cargo-cyclonedx writes <package>.cdx.json next to the manifest.
          cp mailgrit-app-desktop.cdx.json stage/mailgrit-sbom-${{ matrix.name }}.cdx.json
          7z a "${{ matrix.archive }}" ./stage/*
          ls -la "${{ matrix.archive }}"

      - name: Stage binary + SBOM + README (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" stage/
          cp README.md README.uk.md LICENSE-MIT LICENSE-APACHE stage/
          cp mailgrit-app-desktop.cdx.json stage/mailgrit-sbom-${{ matrix.name }}.cdx.json
          tar -czf "${{ matrix.archive }}" -C stage .
          ls -la "${{ matrix.archive }}"

      # Compute sha256 of the archive + SBOM, one "<hash>  <file>" per line.
      # This is the input to SLSA provenance (subjects) and is reused by cosign.
      - name: Compute sha256 subjects
        id: hash
        shell: bash
        run: |
          # Cross-OS sha256: no single tool exists on all three runners.
          #   Linux:  sha256sum  (GNU coreutils)
          #   macOS:  shasum -a 256
          #   Windows (Git Bash): neither — use PowerShell Get-FileHash.
          # Detect the first available one and emit the standard
          # "<hash>  <file>" line (the SLSA generator + cosign format).
          file="${{ matrix.archive }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$file" > hashes-${{ matrix.name }}.txt
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$file" > hashes-${{ matrix.name }}.txt
          else
            # Windows Git Bash fallback: PowerShell writes "<hash>" on its own
            # line; reformat into the "<hash>  <file>" shape the consumers expect.
            h=$(powershell -NoProfile -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath '$file').Hash.ToLower()")
            printf '%s  %s\n' "$h" "$file" > hashes-${{ matrix.name }}.txt
          fi
          cat hashes-${{ matrix.name }}.txt
          # base64-encode the whole block for the SLSA generic generator's
          # base64-subjects input. Avoid `base64 -w0` (GNU-only); BSD base64 on
          # macOS has no -w flag, so strip newlines with tr instead.
          echo "hashes=$(cat hashes-${{ matrix.name }}.txt | base64 | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact (archive + SBOM + bloat + hashes)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            stage/mailgrit-sbom-${{ matrix.name }}.cdx.json
            hashes-${{ matrix.name }}.txt
            bloat-${{ matrix.name }}.txt
          retention-days: 7
          if-no-files-found: error

  # ==========================================================================
  # SLSA build provenance — attest the build origin of every archive.
  # Uses the SLSA generic generator (keyless, via GitHub OIDC). Produces a
  # DSSE/in-toto attestation that the archives were built from this workflow
  # run. Verified with `slsa-verifier`.
  #
  # The SLSA generator is a *reusable workflow* — GitHub Actions requires it to
  # be referenced at the job level (`provenance.uses`), NOT inside `steps`.
  # A reusable-workflow job cannot contain its own steps, so the subject list
  # (base64 of the merged sha256 hashes) is prepared in a separate job
  # (`provenance-subjects`) and passed via outputs.
  # ==========================================================================
  provenance-subjects:
    name: Collect SLSA subjects
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      base64: ${{ steps.subjects.outputs.base64 }}
    steps:
      # The matrix jobs each produced a hashes-* artifact. Download them all and
      # merge into a single subject list for the SLSA generator.
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Build merged subject list
        id: subjects
        run: |
          # Concatenate every per-platform hashes file into one subjects list.
          cat release-assets/hashes-*.txt > subjects.txt
          echo "Merged subjects:"
          cat subjects.txt
          echo "base64=$(base64 -w0 < subjects.txt)" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    needs: [provenance-subjects]
    permissions:
      actions: read
      id-token: write
      contents: write
    # Reusable workflow — MUST be at the job level (not inside steps).
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.provenance-subjects.outputs.base64 }}
      upload-assets: true

  # ==========================================================================
  # cosign keyless signing — detached signature per archive.
  # Signs each archive's sha256 with an ephemeral key issued via the GitHub OIDC
  # identity. The signature + certificate are published to the Sigstore Rekor
  # transparency log, so anyone can verify authenticity later without trusting
  # GitHub. Output: <archive>.sig + <archive>.pem per platform.
  # ==========================================================================
  sign:
    name: cosign sign (keyless)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.4.1"   # pinned for reproducibility

      # Keyless (passwordless) signing: cosign requests an ephemeral certificate
      # from Fulcio using the workflow's OIDC identity, signs each archive,
      # uploads the signature + certificate to Rekor.
      - name: Sign every archive (keyless, via Rekor)
        env:
          COSIGN_EXPERIMENTAL: "1"   # keyless mode
        run: |
          set -euo pipefail
          for archive in release-assets/mailgrit-windows-x86_64.zip \
                         release-assets/mailgrit-linux-x86_64.tar.gz \
                         release-assets/mailgrit-macos-arm64.tar.gz; do
            echo "Signing $archive ..."
            # sign-blob: detached .sig + writes the signing cert to .pem.
            cosign sign-blob --yes --output-signature "${archive}.sig" --output-certificate "${archive}.pem" "$archive"
            echo "Signed: ${archive}.sig + ${archive}.pem"
          done

      - name: Upload signing artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signatures
          path: |
            release-assets/mailgrit-windows-x86_64.zip.sig
            release-assets/mailgrit-windows-x86_64.zip.pem
            release-assets/mailgrit-linux-x86_64.tar.gz.sig
            release-assets/mailgrit-linux-x86_64.tar.gz.pem
            release-assets/mailgrit-macos-arm64.tar.gz.sig
            release-assets/mailgrit-macos-arm64.tar.gz.pem
          retention-days: 7
          if-no-files-found: error

  # ==========================================================================
  # Publish — attach archives + SBOMs + signatures to the GitHub Release.
  # Provenance is already attached by the provenance job (upload-assets: true).
  # ==========================================================================
  release:
    name: Publish GitHub Release
    needs: [build, provenance, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Download all artifacts (archives, SBOMs, signatures)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets/

      - name: Determine tag
        id: tag
        # Expressions reach the shell only through env variables: a ${{ ... }}
        # interpolated directly into run: would let a dispatch caller control
        # the script (inputs.tag is user input, not a constant).
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=${TAG_INPUT}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update release with binaries, SBOMs and signatures
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: MailGrit ${{ steps.tag.outputs.tag }}
          body: |
            ## MailGrit ${{ steps.tag.outputs.tag }}

            Cross-platform desktop client for bulk iRedAdmin automation.

            ### Downloads
            - **Windows** (x86_64): `mailgrit-windows-x86_64.zip`
            - **Linux** (x86_64): `mailgrit-linux-x86_64.tar.gz`
            - **macOS** (Apple Silicon): `mailgrit-macos-arm64.tar.gz`

            ### Supply-chain verification
            Each archive is **signed** (`<archive>.sig` + `<archive>.pem`) and the
            release carries a **SLSA build provenance** attestation plus a per-platform
            **CycloneDX SBOM** (`mailgrit-sbom-*.cdx.json`). Every binary embeds its
            full dependency list (cargo-auditable).

            Verify a signature (requires [cosign](https://github.com/sigstore/cosign)):
            ```bash
            cosign verify-blob \
              --certificate mailgrit-windows-x86_64.zip.pem \
              --signature mailgrit-windows-x86_64.zip.sig \
              --certificate-identity-regexp 'https://github.com/netreondev/MailGrit/.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              mailgrit-windows-x86_64.zip
            ```

            Verify provenance (requires [slsa-verifier](https://github.com/slsa-framework/slsa-verifier)):
            ```bash
            slsa-verifier verify-artifact mailgrit-windows-x86_64.zip \
              --source-uri github.com/netreondev/MailGrit \
              --provenance-path multiple.intoto.jsonl
            ```

            Scan a binary for known vulnerabilities (dependency list is embedded):
            ```bash
            cargo install cargo-audit cargo-auditable
            cargo audit bin ./mailgrit-app-desktop.exe
            ```

            See the [README](https://github.com/netreondev/MailGrit#readme) for usage and the [website](https://netreondev.github.io/MailGrit/) for an overview.

            Dual-licensed under MIT OR Apache-2.0.
          files: |
            release-assets/mailgrit-windows-x86_64.zip
            release-assets/mailgrit-linux-x86_64.tar.gz
            release-assets/mailgrit-macos-arm64.tar.gz
            release-assets/mailgrit-windows-x86_64.zip.sig
            release-assets/mailgrit-windows-x86_64.zip.pem
            release-assets/mailgrit-linux-x86_64.tar.gz.sig
            release-assets/mailgrit-linux-x86_64.tar.gz.pem
            release-assets/mailgrit-macos-arm64.tar.gz.sig
            release-assets/mailgrit-macos-arm64.tar.gz.pem
            release-assets/mailgrit-sbom-windows-x86_64.cdx.json
            release-assets/mailgrit-sbom-linux-x86_64.cdx.json
            release-assets/mailgrit-sbom-macos-arm64.cdx.json
          # Draft first: a human reviews assets/signatures/provenance before the
          # tag goes public (the job holds contents:write + id-token:write).
          draft: true
          prerelease: false
