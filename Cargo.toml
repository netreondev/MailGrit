# MailGrit — cross-platform desktop client (Windows/Linux/macOS ARM) for bulk
# iRedAdmin automation. Dioxus desktop (no Node/JS toolchain).
#
# Workspace layout, lint discipline, and supply-chain policy.
# Each crate compiles/tests in isolation (`cargo test -p <crate>`).

[workspace]
resolver = "2"
members = [
    "crates/core-domain",
    "crates/core-csv",
    "crates/core-storage",
    "crates/core-security",
    "crates/app-desktop",
]
# The fuzz crate builds under nightly with libfuzzer-sys (FFI/coverage), so it is
# intentionally NOT a workspace member. Excluding it keeps `cargo +nightly fuzz`
# self-contained: Cargo will not try to fold it into this workspace (which would
# fail because the strict workspace lints forbid the fuzz crate's FFI code).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.4"
edition = "2024"          # Rust 2024 Edition — native async fn in traits, etc.
rust-version = "1.97.1"   # matches rust-toolchain.toml exactly
license = "MIT OR Apache-2.0"
authors = ["Netreon™ and contributors"]
description = "Cross-platform desktop client for bulk iRedAdmin automation"
repository = "https://github.com/netreondev/MailGrit"
homepage = "https://netreondev.github.io/MailGrit"
documentation = "https://github.com/netreondev/MailGrit#readme"
readme = "README.md"
keywords = ["iredadmin", "email", "automation", "bulk-operations", "desktop"]
categories = ["gui", "network-programming", "authentication"]
publish = false           # internal workspace crates, not published to crates.io

# ----------------------------------------------------------------------------
# cargo-auditable — embed dependency info into the release binary
# (https://github.com/rust-secure-tools/cargo-auditable).
# `cargo auditable build` compiles `auditable-serde` data (crate names, versions,
# RUSTSEC advisories at build time) into a `.dep-vices` section of the binary.
# This lets a user run `cargo audit bin mailgrit-app-desktop` on a downloaded
# binary to check it for known vulnerabilities — without source access.
# Required for the release workflow (see .github/workflows/release.yml).
# ----------------------------------------------------------------------------
[workspace.metadata.auditable]
# Strict mode: fail the build if the dependency list cannot be embedded.
strict = true

# ----------------------------------------------------------------------------
# Unified workspace lint discipline.
# These lints must not be silenced without a separate "lint-suppression" review tag.
# ----------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"   # no exceptions: wry 0.53 returns HttpOnly cookies natively
# Release gate: every public API item must be documented, no dead/unused code,
# and the 2018-idioms lint group keeps the crate modern. All deny (blocking).
missing_docs = "deny"
dead_code = "deny"
# `unused` and `rust_2018_idioms` are lint GROUPS — they need a negative
# priority so they apply at the group level (same pattern as the clippy groups
# below), otherwise rustc errors on a group sharing the default priority.
unused = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }

# Register the custom cfgs `kani` (activated by the Kani toolchain via cargo
# kani) and `miri` (activated by `cargo miri`). Without registration rustc warns
# about unexpected_cfgs for `#[cfg(kani)]` / `#[cfg_attr(miri, ignore)]`.
# See crates/*/src/kani_harnesses.rs and crates/core-storage/src/audit_tests.rs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(miri)'] }

[workspace.lints.clippy]
# Baseline — deny warnings (as in the mandatory clippy command).
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Lints that may not be silenced without exceptions.
unwrap_used = "deny"
expect_used = "deny"      # production code; tests override locally
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"     # logs only via tracing, never println!
print_stderr = "deny"

# cargo-lints constraints: Cargo.toml must stay clean.
multiple_crate_versions = "warn"   # warn — allows transitive duplicates (e.g. web-sys)
wildcard_dependencies = "deny"     # forbid "*" versions — deny.toml rule duplicated here

# ----------------------------------------------------------------------------
# Workspace dev-dependencies (available to all crates via [dev-dependencies]).
# Versions are added via cargo add with explicit pinning.
# ----------------------------------------------------------------------------
# (dependencies are declared per crate for isolated compilation)

# ----------------------------------------------------------------------------
# Internal crate dependencies — single source of truth for the version, so the
# path-dependency versions cannot drift from the workspace package version.
# Members reference these as `mailgrit-core-foo = { workspace = true }`.
# ----------------------------------------------------------------------------
[workspace.dependencies]
# Internal crates — single source of truth for the version.
mailgrit-core-csv = { version = "0.1.4", path = "crates/core-csv" }
mailgrit-core-domain = { version = "0.1.4", path = "crates/core-domain" }
mailgrit-core-storage = { version = "0.1.4", path = "crates/core-storage" }
mailgrit-core-security = { version = "0.1.4", path = "crates/core-security" }

# Third-party dependencies shared by several members — declared once so the
# versions cannot drift between manifests (previously thiserror was spelled
# out in 5 manifests, rand in 2, criterion in 2).
thiserror = "2.0.19"
rand = "0.10.2"
zeroize = "1.9.0"
tracing = "0.1"

# Dev-only, shared by the crates with benchmarks (core-csv, core-security).
criterion = "0.8"
