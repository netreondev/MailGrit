[package]
name = "mailgrit-app-desktop"
description = "Dioxus 0.7 desktop application: iRedAdmin login window, cookie extraction, native RSX panel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mailgrit_app_desktop"
path = "src/lib.rs"

[[bin]]
name = "mailgrit-app-desktop"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }
dioxus-desktop = "0.7.10"
# Decodes the logo PNG into RGBA for the tao::Icon window (already a transitive
# dependency via rfd — added explicitly because it is used directly in src/window_icon.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
http = "1"
mailgrit-core-csv = { workspace = true }
mailgrit-core-domain = { workspace = true }
mailgrit-core-storage = { workspace = true }
mailgrit-core-security = { workspace = true }
rfd = "0.17.2"
tao = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
thiserror = "2.0.19"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5.8"
wry = "0.53"
rust-i18n = "4.2.1"

[lints]
workspace = true

# cargo-machete: dioxus-desktop is NOT an unused dependency — false positive.
# This crate activates the `desktop` feature in `dioxus` and re-exports the
# `dioxus::desktop` module (use_window, Config, WindowBuilder, LogicalSize), which
# is actively used in main.rs, theme.rs, components/titlebar.rs. Machete does not
# see this indirect path through the re-export, so it is listed here explicitly.
[package.metadata.cargo-machete]
ignored = ["dioxus-desktop"]

[dev-dependencies]
# core-* crates are available through [dependencies]; here only test tooling.
# tokio is already in [dependencies] with the same feature set — repeating it in
# dev-deps would be redundant.

[build-dependencies]
# Embeds the application icon and version metadata into the .exe (Windows).
# On other OSes build.rs is a no-op (the icon is set by .with_window_icon at runtime).
winres = "0.1"
