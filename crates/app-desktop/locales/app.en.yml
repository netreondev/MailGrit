# MailGrit UI translations — English (source of truth, default locale).
#
# Variable interpolation: %{name}  (rust-i18n 4.x syntax).
# Keys are grouped by domain. When adding a new string:
#   1. Add the key here (en) and in every app.<lang>.yml (9 languages).
#   2. The all_translated_locales_locked test checks that nav.operations has a
#      translation for each language; interpolation_placeholders_resolve_in_all_locales
#      checks that placeholders resolve without name drift.
