[package]
name = "mailgrit-core-security"
description = "At-rest cryptography: streaming AEAD (XChaCha20-Poly1305), hash-chained audit (HMAC-SHA256), KDF (Argon2id)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.11.0"
hmac = "0.13.0"
rand = "0.10.2"
sha2 = "0.11.0"
subtle = "2"
thiserror = "2.0.19"
zeroize = { version = "1.9.0", features = ["derive"] }

# Kani note: see crates/core-domain/Cargo.toml. Formal verification via
# `cargo kani -p mailgrit-core-security`; harnesses in src/kani_harnesses.rs.

[lints]
workspace = true
