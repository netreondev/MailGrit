[package]
name = "mailgrit-core-security"
description = "At-rest cryptography: streaming AEAD (XChaCha20-Poly1305), hash-chained audit (HMAC-SHA256), KDF (Argon2id)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.11.0"
hmac = "0.13.0"
rand = { workspace = true }
sha2 = "0.11.0"
subtle = "2"
thiserror = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

# Kani note: see crates/core-domain/Cargo.toml. Formal verification via
# `cargo kani -p mailgrit-core-security`; harnesses in src/kani_harnesses.rs.

[lints]
workspace = true

[dev-dependencies]
# criterion — micro-benchmarks for the crypto hot paths (AEAD, hash-chain).
# Run locally: `cargo bench -p mailgrit-core-security`. CI only compiles
# benches (cargo bench --no-run) to keep them buildable and catch compile
# breakage; it does NOT time anything, so it cannot catch performance
# regressions — those must be checked by a local `cargo bench` run.
criterion = { workspace = true }

[[bench]]
name = "crypto"
harness = false   # criterion provides its own main
