<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MailGrit">
  <defs>
    <linearGradient id="fm-bg" x1="5.33" y1="5.33" x2="58.67" y2="58.67" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="0.42" stop-color="#2563EB"/>
      <stop offset="0.78" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="fm-sheen" x1="8" y1="8" x2="34.67" y2="37.33" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fm-m" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BAE6FD"/>
    </linearGradient>
    <filter id="fm-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.7"/>
    </filter>
  </defs>

  <!-- Rounded pillow square: volumetric gradient + directional sheen. -->
  <rect x="5.33" y="5.33" width="53.33" height="53.33" rx="16" fill="url(#fm-bg)"/>
  <rect x="5.33" y="5.33" width="53.33" height="53.33" rx="16" fill="url(#fm-sheen)"/>
  <!-- Edge-light: thin light inner contour top-left ("forged metal"). -->
  <rect x="6.93" y="6.93" width="50.13" height="50.13" rx="14.4" fill="none"
        stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.87"/>

  <!-- White-hot forged glow underlay (forged metal at heat). -->
  <path d="M16 46 L16 18 L32 34 L48 18 L48 46" fill="none"
        stroke="#7DD3FC" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.6" filter="url(#fm-glow)"/>

  <!-- Forged M: Mail (monogram) + Grit (laminated, ascending cyan).
       M = left leg → valley → right leg, one polyline, round caps. -->
  <path d="M16 46 L16 18 L32 34 L48 18 L48 46" fill="none"
        stroke="url(#fm-m)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Forge seams: laminated-steel notches across the outer legs (bulk/strata). -->
  <g stroke="#1D4ED8" stroke-opacity="0.38" stroke-width="1.5" stroke-linecap="round">
    <line x1="13.4" y1="25" x2="18.6" y2="25"/>
    <line x1="13.4" y1="32" x2="18.6" y2="32"/>
    <line x1="13.4" y1="39" x2="18.6" y2="39"/>
    <line x1="45.4" y1="25" x2="50.6" y2="25"/>
    <line x1="45.4" y1="32" x2="50.6" y2="32"/>
    <line x1="45.4" y1="39" x2="50.6" y2="39"/>
  </g>
</svg>
